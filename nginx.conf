# Static hosting for Twitch Multiview. Copied to /etc/nginx/conf.d/default.conf by the Dockerfile.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Compression for the text assets (the app is a handful of small files).
  gzip on;
  gzip_types text/css text/javascript application/javascript image/svg+xml;

  # Server-level headers apply to every response. Do not add `add_header` inside a location:
  # nginx would then drop all of these for that location.
  #
  # Twitch refuses to play embeds without a Referer, so keep the referrer policy at
  # strict-origin-when-cross-origin (or looser).
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://player.twitch.tv; style-src 'self'; img-src 'self' data:; frame-src https://player.twitch.tv; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
  # Files are not fingerprinted, so let browsers revalidate (ETag) instead of caching blindly.
  add_header Cache-Control "no-cache" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # Liveness probe for Docker/Coolify health checks.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
